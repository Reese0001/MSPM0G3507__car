schema: spec-driven

context: |
  2026 电赛小车平台：基于 TI MSPM0G3507 (Cortex-M0+, 80MHz) 的裸机嵌入式工程。
  工具链: TI Arm Clang (ti-cgt-armllvm 4.0.4), CCS Theia, mspm0_sdk_2_10_00_04。
  硬件: 两驱底盘 (L型520减速电机×2 + 万向轮×2), MPU6050姿态传感器, 八路灰度循迹传感器, 12.6V电源。
  电机驱动板通过 UART1 协议帧通信 (非直接PWM)。
  采用协作式时间片轮询调度器 (无RTOS)。
  C源码注释为GBK编码，文档为UTF-8。
  安全要求: 电机必须Soft-start (0→30% ramp), 带定时器失控监控。

rules:
  proposal:
    - 涉及电机的改动必须包含安全层 (Motor-Safety-Layer) checklist
    - 引脚变更需先确认无 SysConfig 冲突
    - 保持与现有 BSP 模块接口兼容
  tasks:
    - 单个任务不超过2小时工作量
    - 每个任务标注涉及的 BSP 模块和引脚
    - 编译验证作为独立任务
